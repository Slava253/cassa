<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Marka | Сотрудник</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .member-item {
            background: #f8faff;
            border-radius: 18px;
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid #eef2f8;
        }
        .btn-success { background: #1d6f2c; color: white; }
        .btn-success:hover { background: #155a22; }
        .btn-danger { background: #b33a34; color: white; }
        .btn-danger:hover { background: #8f2d28; }
        .btn-warning { background: #d4a13e; color: white; }
        .btn-warning:hover { background: #b8892e; }
        .small-btn {
            padding: 4px 12px;
            font-size: 0.65rem;
            background: #e6edf6;
            color: #1a1a2e;
            border-radius: 30px;
            cursor: pointer;
            border: none;
            font-weight: 500;
        }
        .small-btn.danger {
            background: #fee9e9;
            color: #b33a34;
        }
        .small-btn:hover { opacity: 0.8; }
        .badge {
            background: #eef4ff;
            color: #1a1a2e;
            border-radius: 30px;
            padding: 3px 12px;
            font-size: 0.65rem;
            font-weight: 600;
            display: inline-block;
        }
        .form-group { margin-bottom: 12px; }
        label { font-weight: 600; color: #1e2f41; display: block; margin-bottom: 4px; font-size: 0.8rem; }
        input { width: 100%; padding: 10px 14px; border: 1.5px solid #dae2ec; border-radius: 14px; font-size: 0.9rem; background: #fbfdff; }
        input:focus { outline: none; border-color: #1a1a2e; box-shadow: 0 0 0 3px rgba(26,26,46,0.08); }
        button {
            background: #1a1a2e;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.8rem;
        }
        button:hover:not(:disabled) {
            background: #0e0e1e;
            transform: scale(0.97);
        }
        .empty-state {
            text-align: center;
            padding: 24px;
            color: #7a8a9e;
            background: #f8faff;
            border-radius: 16px;
            font-size: 0.85rem;
        }
        .loading-spinner {
            text-align: center;
            padding: 24px;
            color: #7a8a9e;
        }
        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 600px) {
            .grid-2col { grid-template-columns: 1fr; }
        }
        .success-toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1d6f2c;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            z-index: 9999;
            animation: slideFade 3s ease forwards;
            max-width: 90%;
        }
        @keyframes slideFade {
            0% { opacity: 0; transform: translateY(20px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(20px); visibility: hidden; }
        }
        .card {
            background: #ffffff;
            border-radius: 20px;
            border: 1px solid #eef2f8;
            padding: 16px 20px;
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 1.1rem;
            font-weight: 650;
            color: #1a1a2e;
            border-left: 4px solid #f6b83d;
            padding-left: 12px;
            margin-bottom: 14px;
        }
        .header {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo-area h1 {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(to right, #fff, #d4e0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo-area p {
            font-size: 0.65rem;
            opacity: 0.7;
            -webkit-text-fill-color: #b6cfff;
        }
        .user-status {
            background: rgba(255,255,255,0.10);
            padding: 6px 14px;
            border-radius: 40px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 0.8rem;
        }
        .user-status button {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 0.65rem;
            cursor: pointer;
        }
        .main-content {
            padding: 16px 20px;
        }
        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        body {
            background: #f0f4f9;
            min-height: 100vh;
            padding: 10px;
            font-family: -apple-system, 'Segoe UI', 'Roboto', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo-area">
                <h1>💳 Marka</h1>
                <p>Панель сотрудника</p>
            </div>
            <div class="user-status">
                <span id="employeeName">👤 Сотрудник</span>
                <button onclick="logout()">Выйти</button>
            </div>
        </div>

        <div class="main-content">
            <!-- Поиск клиента по QR -->
            <div class="card">
                <div class="card-title">🎫 Найти клиента по QR</div>
                <div style="display:flex; gap:12px; flex-wrap:wrap;">
                    <div class="form-group" style="flex:2; min-width:200px;">
                        <label>Отсканируйте QR-код клиента</label>
                        <input type="text" id="clientQRInput" placeholder="123456789_987654321_1700000000" style="font-size:1rem; font-family:monospace;">
                    </div>
                    <button onclick="findClientByQR()" style="align-self:flex-end;">🔍 Найти</button>
                </div>
                <div id="foundClient" style="display:none;" class="member-item" style="margin-top:12px;"></div>
            </div>

            <!-- Прием товара -->
            <div class="card" style="border: 2px solid #f6b83d;">
                <div class="card-title">📦 Прием товара</div>
                <div style="display:flex; gap:12px; flex-wrap:wrap;">
                    <div class="form-group" style="flex:2; min-width:200px;">
                        <label>🔲 Отсканируйте штрихкод товара</label>
                        <input type="text" id="receiveBarcode" placeholder="4601234567890" style="font-size:1.2rem; font-family:monospace;">
                    </div>
                    <button onclick="findOrdersByProduct()" style="align-self:flex-end;">🔍 Найти заказы</button>
                </div>
                <div id="foundOrders" style="margin-top:12px;"></div>
            </div>

            <!-- Выдача/Возврат -->
            <div class="card" style="border: 2px solid #1d6f2c;">
                <div class="card-title">🔄 Выдача/Возврат</div>
                <div style="display:flex; gap:12px; flex-wrap:wrap;">
                    <div class="form-group" style="flex:2; min-width:200px;">
                        <label>🔲 Отсканируйте штрихкод товара</label>
                        <input type="text" id="returnBarcode" placeholder="4601234567890" style="font-size:1.2rem; font-family:monospace;">
                    </div>
                    <div class="form-group" style="flex:1; min-width:80px;">
                        <label>Количество</label>
                        <input type="number" id="returnQuantity" value="1" min="1">
                    </div>
                    <button onclick="processReturn()" style="align-self:flex-end;">🔄 Выдать/Вернуть</button>
                </div>
                <div id="returnResult" style="margin-top:12px;"></div>
            </div>
        </div>
    </div>

    <div id="toast" class="success-toast" style="display:none;"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/qrcode.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/employee.js"></script>
</body>
</html>
