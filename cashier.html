<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="img/icon-192.png">
    <title>Магазин | Касса</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo-area">
                <h1>💳 Магазин</h1>
                <p id="cashierStoreDisplay">Кассовый терминал</p>
            </div>
            <div class="user-status">
                <span id="cashierName">👤 Кассир</span>
                <button onclick="logout()">Выйти</button>
            </div>
        </div>

        <div class="main-content">
            <!-- Сканирование клиента -->
            <div class="card">
                <div class="card-title">🎫 Найти клиента</div>
                <div style="display:flex; gap:12px; flex-wrap:wrap;">
                    <div class="form-group" style="flex:2; min-width:200px;">
                        <label>Номер карты или телефон</label>
                        <input type="text" id="clientScanInput" placeholder="29XXXXXXXXXX или +7 900 123-45-67">
                    </div>
                    <button onclick="scanClient()" style="align-self:flex-end;">🔍 Найти</button>
                </div>
                <div id="scannedClient" style="display:none;" class="member-item" style="margin-top:12px;"></div>
            </div>

            <!-- Списание баллов -->
            <div id="discountSection" class="discount-section" style="display:none;">
                <div class="flex-between">
                    <div>
                        <strong>⭐ Баллы клиента: <span id="clientPointsDisplay" class="badge-points">0</span></strong>
                        <div style="font-size:0.8rem; color:#3e5f7e; margin-top:4px;">10 баллов = 1 ₽ скидки</div>
                    </div>
                    <div style="display:flex; gap:10px; flex-wrap:wrap;">
                        <button onclick="applyDiscount()" class="btn-success" style="font-size:0.85rem;">✨ Списать баллы</button>
                        <button onclick="removeDiscount()" class="btn-warning" style="font-size:0.85rem;">❌ Убрать скидку</button>
                    </div>
                </div>
                <div id="discountInfo" style="margin-top:8px; font-weight:bold; color:#1d6f2c;"></div>
            </div>

            <!-- Добавление товара -->
            <div class="card" style="border: 2px solid #f6b83d;">
                <div class="card-title">📦 Добавить товар</div>
                <div class="grid-2col">
                    <div>
                        <div class="form-group">
                            <label>🔲 Штрихкод</label>
                            <input type="text" id="productBarcode" placeholder="4601234567890" style="font-size:1.2rem; font-family:monospace;">
                        </div>
                        <div class="form-group">
                            <label>📝 Название</label>
                            <input type="text" id="productName" placeholder="Молоко 'Деревенское' 1л">
                        </div>
                    </div>
                    <div>
                        <div class="form-group">
                            <label>💰 Обычная цена (₽)</label>
                            <input type="number" id="productPrice" step="0.01" placeholder="89.90">
                        </div>
                        <div class="form-group">
                            <label>💎 Цена со скидкой (₽)</label>
                            <input type="number" id="productDiscountPrice" step="0.01" placeholder="79.90">
                        </div>
                    </div>
                </div>
                <button onclick="addProductToSystem()" class="btn-success" style="width:100%;">➕ Добавить</button>
            </div>

            <!-- Сканирование товара -->
            <div class="card">
                <div class="card-title">🛒 Сканировать товар</div>
                <div style="display:flex; gap:12px; flex-wrap:wrap;">
                    <div class="form-group" style="flex:2; min-width:200px;">
                        <label>🔲 Штрихкод товара</label>
                        <input type="text" id="cartBarcodeInput" placeholder="4601234567890" style="font-size:1.2rem; font-family:monospace;">
                    </div>
                    <div class="form-group" style="flex:1; min-width:80px;">
                        <label>Кол-во</label>
                        <input type="number" id="cartQuantity" value="1" min="1">
                    </div>
                    <button onclick="addToCart()" style="align-self:flex-end;">➕ Добавить</button>
                </div>
            </div>

            <!-- Корзина -->
            <div class="card">
                <div class="flex-between">
                    <div class="card-title">🛒 Корзина</div>
                    <div><span class="badge">Сумма: <strong id="cartTotal">0.00</strong> ₽</span></div>
                </div>
                <div id="cartList"><div class="empty-state">Корзина пуста</div></div>
                
                <div style="margin-top:16px; padding-top:16px; border-top:2px solid #eef2f8;">
                    <label style="font-weight:600; margin-bottom:10px; display:block;">💳 Способ оплаты:</label>
                    <div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px;">
                        <button onclick="selectPayment('cash')" id="payCash" class="payment-btn" style="flex:1; background:#eef2f8; color:#1a1a2e;">💵 Наличные</button>
                        <button onclick="selectPayment('card')" id="payCard" class="payment-btn" style="flex:1; background:#eef2f8; color:#1a1a2e;">💳 Карта</button>
                    </div>
                    <div id="cashInputArea" style="display:none;">
                        <div class="form-group">
                            <label>💰 Сумма от покупателя:</label>
                            <input type="number" id="cashGiven" step="0.01" placeholder="Введите сумму" style="font-size:1.1rem;">
                        </div>
                        <div id="changeDisplay" style="display:none; background:#f0f9f0; padding:12px; border-radius:16px; margin-bottom:12px;">
                            <strong>💵 Сдача: <span id="changeAmount" style="color:#1d6f2c; font-size:1.3rem;">0.00 ₽</span></strong>
                        </div>
                    </div>
                    <div style="display:flex; gap:12px; flex-wrap:wrap;">
                        <button onclick="processPayment()" class="btn-success" style="flex:2;">💵 Оплатить</button>
                        <button onclick="clearCart()" class="small-btn danger" style="flex:1;">🗑 Очистить</button>
                    </div>
                </div>
            </div>

            <!-- История -->
            <div class="card">
                <div class="card-title">📜 История</div>
                <div id="cashierHistory"><div class="loading-spinner">Загрузка...</div></div>
            </div>
        </div>
    </div>

    <div id="toast" class="success-toast" style="display:none;"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/barcode.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cashier.js"></script>
</body>
</html>
