<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#0b1e3a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="img/icon-192.png">
    <title>ГУ СВС | Касса</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo-area">
                <h1>💳 ГУ СВС</h1>
                <p>Кассовый терминал</p>
            </div>
            <div class="user-status" id="userStatus">
                <span id="cashierName">👤 Кассир</span>
                <button onclick="logout()">Выйти</button>
            </div>
        </div>

        <div class="main-content">
            <!-- Сканирование карты клиента -->
            <div class="card">
                <div class="card-title">🎫 Сканировать карту клиента</div>
                <div style="display:flex; gap:12px; flex-wrap:wrap;">
                    <div class="form-group" style="flex:2; min-width:200px;">
                        <label>Введите штрихкод карты или номер телефона</label>
                        <input type="text" id="clientScanInput" placeholder="29XXXXXXXXXX или +7 900 123-45-67">
                    </div>
                    <button onclick="scanClient()" style="align-self:flex-end;">🔍 Найти</button>
                </div>
                <div id="scannedClient" style="display:none;" class="member-item" style="margin-top:12px;"></div>
            </div>

            <!-- Товары -->
            <div class="card">
                <div class="card-title">📦 Добавить товар</div>
                <div style="display:flex; gap:12px; flex-wrap:wrap;">
                    <div class="form-group" style="flex:2; min-width:150px;"><label>Штрихкод</label><input type="text" id="productBarcode" placeholder="Введите штрихкод"></div>
                    <div class="form-group" style="flex:1; min-width:100px;"><label>Кол-во</label><input type="number" id="productQuantity" value="1" min="1"></div>
                    <div class="form-group" style="flex:1; min-width:120px;"><label>Цена (₽)</label><input type="number" id="productPrice" step="0.01" placeholder="0.00"></div>
                    <button onclick="addProduct()" style="align-self:flex-end;">➕ Добавить</button>
                </div>
            </div>

            <!-- Корзина -->
            <div class="card">
                <div class="flex-between">
                    <div class="card-title">🛒 Корзина</div>
                    <div><span class="badge">Сумма: <strong id="cartTotal">0.00</strong> ₽</span></div>
                </div>
                <div id="cartList"><div class="empty-state">Корзина пуста</div></div>
                <div style="display:flex; gap:12px; margin-top:12px; flex-wrap:wrap;">
                    <button onclick="processPayment()" class="btn-success" style="flex:1;">💵 Оплатить</button>
                    <button onclick="clearCart()" class="small-btn danger" style="flex:1;">🗑 Очистить</button>
                </div>
            </div>

            <!-- История -->
            <div class="card">
                <div class="card-title">📜 История покупок</div>
                <div id="cashierHistory"><div class="loading-spinner">Загрузка...</div></div>
            </div>
        </div>
    </div>

    <div id="toast" class="success-toast" style="display:none;"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/cashier.js"></script>
</body>
</html>
