<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="img/icon-192.png">
    <title>Marka | Продавец</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo-area">
                <h1>📦 Marka</h1>
                <p>Панель продавца</p>
            </div>
            <div class="user-status">
                <span id="sellerName">👤 Продавец</span>
                <button onclick="logout()">Выйти</button>
            </div>
        </div>

        <div class="main-content">
            <!-- Добавление товара -->
            <div class="card" style="border: 2px solid #f6b83d;">
                <div class="card-title">📦 Добавить товар</div>
                <div class="grid-2col">
                    <div>
                        <div class="form-group">
                            <label>🔲 Штрихкод (сканируйте с упаковки)</label>
                            <input type="text" id="productBarcode" placeholder="4601234567890" style="font-size:1.2rem; font-family:monospace;">
                        </div>
                        <div class="form-group">
                            <label>📝 Название товара</label>
                            <input type="text" id="productName" placeholder="Например: Футболка хлопок">
                        </div>
                        <div class="form-group">
                            <label>💰 Цена (₽)</label>
                            <input type="number" id="productPrice" step="0.01" placeholder="1499.00">
                        </div>
                    </div>
                    <div>
                        <div class="form-group">
                            <label>📏 Размер товара</label>
                            <select id="productSize">
                                <option value="small">Маленький (ПВЗ)</option>
                                <option value="large">Большой (только курьер)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>📋 Описание</label>
                            <textarea id="productDescription" rows="3" placeholder="Описание товара..."></textarea>
                        </div>
                    </div>
                </div>
                <button onclick="addProduct()" class="btn-success" style="width:100%; padding:14px;">➕ Добавить товар</button>
                <div id="addProductStatus" style="margin-top:8px; font-size:0.85rem; color:#7a8a9e;"></div>
            </div>

            <!-- Список товаров -->
            <div class="card">
                <div class="card-title">📋 Список товаров</div>
                <div id="productsList"><div class="loading-spinner">Загрузка...</div></div>
            </div>
        </div>
    </div>

    <div id="toast" class="success-toast" style="display:none;"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/seller.js"></script>
</body>
</html>
