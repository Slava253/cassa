<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#0b1e3a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="img/icon-192.png">
    <title>ГУ СВС | Вход</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo-area">
                <h1>🏪 ГУ СВС</h1>
                <p>Государственные услуги • Касса • Бонусы</p>
            </div>
        </div>

        <div class="main-content">
            <div class="card" style="max-width:520px; margin:0 auto;">
                <div class="card-title">🔐 Вход в систему</div>
                
                <div class="role-selector">
                    <div class="role-btn active" data-role="admin" onclick="selectRole('admin')">👑 Админ</div>
                    <div class="role-btn" data-role="cashier" onclick="selectRole('cashier')">💳 Касса</div>
                    <div class="role-btn" data-role="client" onclick="selectRole('client')">👤 Клиент</div>
                </div>

                <div id="adminLogin" class="login-form">
                    <div class="form-group">
                        <label>👤 Логин</label>
                        <input type="text" id="adminLoginInput" placeholder="Введите логин" value="2347">
                    </div>
                    <div class="form-group">
                        <label>🔒 Пароль</label>
                        <input type="password" id="adminPasswordInput" placeholder="Введите пароль" value="2203">
                    </div>
                    <button onclick="adminLogin()" style="width:100%;">👑 Войти как Админ</button>
                </div>

                <div id="cashierLogin" class="login-form" style="display:none;">
                    <div class="form-group">
                        <label>👤 Логин кассира</label>
                        <input type="text" id="cashierLoginInput" placeholder="Введите логин">
                    </div>
                    <div class="form-group">
                        <label>🔒 Пароль</label>
                        <input type="password" id="cashierPasswordInput" placeholder="Введите пароль">
                    </div>
                    <button onclick="cashierLogin()" style="width:100%;">💳 Войти как Кассир</button>
                </div>

                <div id="clientLogin" class="login-form" style="display:none;">
                    <div class="form-group">
                        <label>📱 Номер телефона</label>
                        <input type="tel" id="clientPhoneInput" placeholder="+7 900 123-45-67">
                    </div>
                    <button onclick="clientLogin()" style="width:100%;">👤 Войти как Клиент</button>
                </div>

                <div style="margin-top:16px;font-size:0.75rem;color:#7a8a9e;text-align:center;">
                    <i class="fas fa-info-circle"></i> Админ: логин 2347 / пароль 2203
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="success-toast" style="display:none;"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Выбор роли
        function selectRole(role) {
            document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.role-btn[data-role="${role}"]`).classList.add('active');
            
            document.getElementById('adminLogin').style.display = role === 'admin' ? 'block' : 'none';
            document.getElementById('cashierLogin').style.display = role === 'cashier' ? 'block' : 'none';
            document.getElementById('clientLogin').style.display = role === 'client' ? 'block' : 'none';
        }

        // Показать toast
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.display = 'block';
            toast.style.background = isError ? '#b33a34' : '#1d6f2c';
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.style.display = 'none', 3000);
        }

        // Проверка сохраненной сессии
        const saved = localStorage.getItem('gusc_user');
        if (saved) {
            try {
                const user = JSON.parse(saved);
                if (user.role === 'admin') window.location.href = 'admin.html';
                else if (user.role === 'cashier') window.location.href = 'cashier.html';
                else if (user.role === 'client') window.location.href = 'client.html';
            } catch(e) { localStorage.removeItem('gusc_user'); }
        }
    </script>
</body>
</html>
