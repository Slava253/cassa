<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="img/icon-192.png">
    <title>У дома | Вход</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo-area">
                <h1>🏪 У дома</h1>
                <p>Касса • Бонусы • Карты</p>
            </div>
        </div>

        <div class="main-content">
            <div class="card login-card">
                <div class="card-title">🔐 Вход в систему</div>
                
                <div class="role-selector-oval">
                    <div class="role-oval active" data-role="admin" onclick="selectRole('admin')">
                        <div class="role-icon">👑</div>
                        <div class="role-name">Админ</div>
                    </div>
                    <div class="role-oval" data-role="cashier" onclick="selectRole('cashier')">
                        <div class="role-icon">💳</div>
                        <div class="role-name">Касса</div>
                    </div>
                    <div class="role-oval" data-role="client" onclick="selectRole('client')">
                        <div class="role-icon">👤</div>
                        <div class="role-name">Клиент</div>
                    </div>
                    <div class="role-oval" data-role="courier" onclick="selectRole('courier')">
                        <div class="role-icon">🚚</div>
                        <div class="role-name">Курьер</div>
                    </div>
                    <div class="role-oval" data-role="support" onclick="selectRole('support')">
                        <div class="role-icon">🆘</div>
                        <div class="role-name">Поддержка</div>
                    </div>
                </div>

                <div id="adminLogin" class="login-form">
                    <div class="form-group">
                        <label>👤 Логин</label>
                        <input type="text" id="adminLoginInput" placeholder="Введите логин">
                    </div>
                    <div class="form-group">
                        <label>🔒 Пароль</label>
                        <input type="password" id="adminPasswordInput" placeholder="Введите пароль">
                    </div>
                    <button onclick="adminLogin()" class="btn-login">👑 Войти</button>
                </div>

                <div id="cashierLogin" class="login-form" style="display:none;">
                    <div class="form-group">
                        <label>🏪 Магазин</label>
                        <select id="cashierStoreSelect">
                            <option value="">Выберите магазин</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>👤 Логин кассира</label>
                        <input type="text" id="cashierLoginInput" placeholder="Введите логин">
                    </div>
                    <div class="form-group">
                        <label>🔒 Пароль</label>
                        <input type="password" id="cashierPasswordInput" placeholder="Введите пароль">
                    </div>
                    <button onclick="cashierLogin()" class="btn-login">💳 Войти</button>
                </div>

                <div id="clientLogin" class="login-form" style="display:none;">
                    <div class="form-group">
                        <label>🏪 Магазин</label>
                        <select id="clientStoreSelect">
                            <option value="">Выберите магазин</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>📱 Номер телефона</label>
                        <div style="display:flex; align-items:center; background:#fbfdff; border:1.5px solid #dae2ec; border-radius:18px; overflow:hidden;">
                            <span style="padding:12px 8px 12px 16px; font-weight:600; color:#1a1a2e; background:#fbfdff; font-size:0.95rem;">+7</span>
                            <input type="tel" id="clientPhoneInput" placeholder="900 123-45-67" inputmode="numeric" pattern="[0-9\-\(\) ]*" style="border:none; border-radius:0; padding:12px 16px 12px 8px; flex:1; background:#fbfdff;">
                        </div>
                    </div>
                    <button onclick="clientLogin()" class="btn-login">👤 Войти</button>
                </div>

                <div id="courierLogin" class="login-form" style="display:none;">
                    <div class="form-group">
                        <label>👤 Логин курьера</label>
                        <input type="text" id="courierLoginInput" placeholder="Введите логин">
                    </div>
                    <div class="form-group">
                        <label>🔒 Пароль</label>
                        <input type="password" id="courierPasswordInput" placeholder="Введите пароль">
                    </div>
                    <button onclick="courierLogin()" class="btn-login">🚚 Войти</button>
                </div>

                <div id="supportLogin" class="login-form" style="display:none;">
                    <div class="form-group">
                        <label>👤 Логин поддержки</label>
                        <input type="text" id="supportLoginInput" placeholder="Введите логин">
                    </div>
                    <div class="form-group">
                        <label>🔒 Пароль</label>
                        <input type="password" id="supportPasswordInput" placeholder="Введите пароль">
                    </div>
                    <button onclick="supportLogin()" class="btn-login">🆘 Войти</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="success-toast" style="display:none;"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function selectRole(role) {
            document.querySelectorAll('.role-oval').forEach(b => b.classList.remove('active'));
            document.querySelector(`.role-oval[data-role="${role}"]`).classList.add('active');
            
            document.getElementById('adminLogin').style.display = role === 'admin' ? 'block' : 'none';
            document.getElementById('cashierLogin').style.display = role === 'cashier' ? 'block' : 'none';
            document.getElementById('clientLogin').style.display = role === 'client' ? 'block' : 'none';
            document.getElementById('courierLogin').style.display = role === 'courier' ? 'block' : 'none';
            document.getElementById('supportLogin').style.display = role === 'support' ? 'block' : 'none';
            
            if (role === 'cashier' || role === 'client') {
                loadStores(role);
            }
        }

        function loadStores(role) {
            const selectId = role === 'cashier' ? 'cashierStoreSelect' : 'clientStoreSelect';
            const select = document.getElementById(selectId);
            select.innerHTML = '<option value="">Загрузка...</option>';
            
            db.ref('stores').once('value', snap => {
                const stores = snap.val();
                select.innerHTML = '<option value="">Выберите магазин</option>';
                if (stores) {
                    for (let key in stores) {
                        const option = document.createElement('option');
                        option.value = key;
                        option.textContent = stores[key].name;
                        select.appendChild(option);
                    }
                }
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            const phoneInput = document.getElementById('clientPhoneInput');
            if (phoneInput) {
                phoneInput.addEventListener('input', function() {
                    this.value = this.value.replace(/[^0-9\-\(\) ]/g, '');
                });
            }
        });

        const saved = localStorage.getItem('shop_user');
        if (saved) {
            try {
                const user = JSON.parse(saved);
                if (user.role === 'admin') window.location.href = 'admin.html';
                else if (user.role === 'cashier') window.location.href = 'cashier.html';
                else if (user.role === 'client') window.location.href = 'client.html';
                else if (user.role === 'courier') window.location.href = 'courier.html';
                else if (user.role === 'support') window.location.href = 'support.html';
            } catch(e) { localStorage.removeItem('shop_user'); }
        }
    </script>
</body>
</html>
