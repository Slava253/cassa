<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="img/icon-192.png">
    <title>Магазин | Админ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo-area">
                <h1>👑 Магазин</h1>
                <p>Панель администратора</p>
            </div>
            <div class="user-status">
                <span>👤 Администратор</span>
                <button onclick="logout()">Выйти</button>
            </div>
        </div>

        <div class="main-content">
            <!-- Создать магазин -->
            <div class="card" style="border: 2px solid #f6b83d;">
                <div class="card-title">🏪 Создать магазин</div>
                <div class="form-group">
                    <label>Название магазина</label>
                    <input type="text" id="storeName" placeholder="Магазин 'У дома'">
                </div>
                <div class="form-group">
                    <label>Адрес</label>
                    <input type="text" id="storeAddress" placeholder="ул. Ленина, 15">
                </div>
                <button onclick="createStore()" class="btn-success" style="width:100%;">🏪 Создать магазин</button>
            </div>

            <!-- Список магазинов -->
            <div class="card">
                <div class="card-title">📋 Список магазинов</div>
                <div id="storesList"><div class="loading-spinner">Загрузка...</div></div>
            </div>

            <!-- Добавить кассира -->
            <div class="card">
                <div class="card-title">➕ Добавить кассира</div>
                <div class="form-group">
                    <label>🏪 Выберите магазин</label>
                    <select id="cashierStoreSelect"><option value="">Выберите магазин</option></select>
                </div>
                <div class="grid-2col">
                    <div>
                        <div class="form-group">
                            <label>👤 ФИО кассира</label>
                            <input type="text" id="cashierFullName" placeholder="Иванов Иван Иванович">
                        </div>
                        <div class="form-group">
                            <label>🎫 Номер карты кассира</label>
                            <input type="text" id="cashierCardNumber" placeholder="0980489781" style="font-size:1.1rem; font-family:monospace;">
                            <div style="font-size:0.7rem; color:#7a8a9e; margin-top:4px;">Введите любой уникальный номер</div>
                        </div>
                    </div>
                    <div>
                        <div class="form-group">
                            <label>🔒 Пароль (для дополнительной защиты)</label>
                            <input type="text" id="cashierPassword" placeholder="123456">
                        </div>
                    </div>
                </div>
                <button onclick="addCashier()" class="btn-login">✅ Добавить кассира</button>
            </div>

            <!-- Список кассиров -->
            <div class="card">
                <div class="card-title">📋 Кассиры по магазинам</div>
                <div id="cashiersList"><div class="loading-spinner">Загрузка...</div></div>
            </div>

            <!-- Список клиентов -->
            <div class="card">
                <div class="card-title">📋 Клиенты</div>
                <div id="clientsList"><div class="loading-spinner">Загрузка...</div></div>
            </div>
        </div>
    </div>

    <div id="toast" class="success-toast" style="display:none;"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
