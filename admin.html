<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="img/icon-192.png">
    <title>Marka | Админ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo-area">
                <h1>👑 Marka</h1>
                <p>Панель администратора</p>
            </div>
            <div class="user-status">
                <span>👤 Администратор</span>
                <button onclick="logout()">Выйти</button>
            </div>
        </div>

        <div class="main-content">
            <!-- Добавить продавца -->
            <div class="card" style="border: 2px solid #f6b83d;">
                <div class="card-title">📦 Добавить продавца</div>
                <div class="grid-2col">
                    <div>
                        <div class="form-group">
                            <label>👤 ФИО продавца</label>
                            <input type="text" id="sellerFullName" placeholder="Иванов Иван Иванович">
                        </div>
                        <div class="form-group">
                            <label>🔑 Логин</label>
                            <input type="text" id="sellerLogin" placeholder="seller123">
                        </div>
                    </div>
                    <div>
                        <div class="form-group">
                            <label>🔒 Пароль</label>
                            <input type="text" id="sellerPassword" placeholder="123456">
                        </div>
                    </div>
                </div>
                <button onclick="addSeller()" class="btn-success" style="width:100%;">📦 Добавить продавца</button>
            </div>

            <!-- Добавить сотрудника -->
            <div class="card" style="border: 2px solid #1d6f2c;">
                <div class="card-title">💳 Добавить сотрудника</div>
                <div class="grid-2col">
                    <div>
                        <div class="form-group">
                            <label>👤 ФИО сотрудника</label>
                            <input type="text" id="employeeFullName" placeholder="Петров Петр Петрович">
                        </div>
                        <div class="form-group">
                            <label>🔑 Логин</label>
                            <input type="text" id="employeeLogin" placeholder="employee123">
                        </div>
                    </div>
                    <div>
                        <div class="form-group">
                            <label>🔒 Пароль</label>
                            <input type="text" id="employeePassword" placeholder="123456">
                        </div>
                    </div>
                </div>
                <button onclick="addEmployee()" class="btn-success" style="width:100%;">💳 Добавить сотрудника</button>
            </div>

            <!-- Добавить курьера -->
            <div class="card" style="border: 2px solid #d4a13e;">
                <div class="card-title">🚚 Добавить курьера</div>
                <div class="grid-2col">
                    <div>
                        <div class="form-group">
                            <label>👤 ФИО курьера</label>
                            <input type="text" id="courierFullName" placeholder="Сидоров Сидор Сидорович">
                        </div>
                        <div class="form-group">
                            <label>🔑 Логин</label>
                            <input type="text" id="courierLogin" placeholder="courier123">
                        </div>
                    </div>
                    <div>
                        <div class="form-group">
                            <label>🔒 Пароль</label>
                            <input type="text" id="courierPassword" placeholder="123456">
                        </div>
                    </div>
                </div>
                <button onclick="addCourier()" class="btn-warning" style="width:100%;">🚚 Добавить курьера</button>
            </div>

            <!-- Добавить поддержку -->
            <div class="card" style="border: 2px solid #7a8a9e;">
                <div class="card-title">🆘 Добавить поддержку</div>
                <div class="grid-2col">
                    <div>
                        <div class="form-group">
                            <label>👤 ФИО сотрудника</label>
                            <input type="text" id="supportFullName" placeholder="Петрова Анна Сергеевна">
                        </div>
                        <div class="form-group">
                            <label>🔑 Логин</label>
                            <input type="text" id="supportLogin" placeholder="support123">
                        </div>
                    </div>
                    <div>
                        <div class="form-group">
                            <label>🔒 Пароль</label>
                            <input type="text" id="supportPassword" placeholder="123456">
                        </div>
                    </div>
                </div>
                <button onclick="addSupport()" class="btn-info" style="width:100%;">🆘 Добавить поддержку</button>
            </div>

            <!-- Списки -->
            <div class="card">
                <div class="card-title">📋 Список продавцов</div>
                <div id="sellersList"><div class="loading-spinner">Загрузка...</div></div>
            </div>

            <div class="card">
                <div class="card-title">📋 Список сотрудников</div>
                <div id="employeesList"><div class="loading-spinner">Загрузка...</div></div>
            </div>

            <div class="card">
                <div class="card-title">📋 Список курьеров</div>
                <div id="couriersList"><div class="loading-spinner">Загрузка...</div></div>
            </div>

            <div class="card">
                <div class="card-title">📋 Список поддержки</div>
                <div id="supportList"><div class="loading-spinner">Загрузка...</div></div>
            </div>

            <div class="card">
                <div class="card-title">📋 Клиенты</div>
                <div id="clientsList"><div class="loading-spinner">Загрузка...</div></div>
            </div>

            <!-- Акции -->
            <div class="card" style="border: 2px solid #ffd700;">
                <div class="card-title">🎉 Акции</div>
                <div id="promotionsList"><div class="loading-spinner">Загрузка...</div></div>
            </div>
        </div>
    </div>

    <div id="toast" class="success-toast" style="display:none;"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
