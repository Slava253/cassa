<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="img/icon-192.png">
    <title>Магазин | Админ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo-area">
                <h1>👑 Магазин</h1>
                <p>Панель администратора</p>
            </div>
            <div class="user-status">
                <span>👤 Администратор</span>
                <button onclick="logout()">Выйти</button>
            </div>
        </div>

        <div class="main-content">
            <!-- Добавить кассира -->
            <div class="card">
                <div class="card-title">➕ Добавить кассира</div>
                <div class="form-group">
                    <label>👤 ФИО кассира</label>
                    <input type="text" id="cashierFullName" placeholder="Иванов Иван Иванович">
                </div>
                <div class="grid-2col">
                    <div class="form-group">
                        <label>🔑 Логин</label>
                        <input type="text" id="cashierLogin" placeholder="ivanov">
                    </div>
                    <div class="form-group">
                        <label>🔒 Пароль</label>
                        <input type="text" id="cashierPassword" placeholder="123456">
                    </div>
                </div>
                <button onclick="addCashier()" class="btn-login">✅ Добавить кассира</button>
            </div>

            <!-- Список кассиров -->
            <div class="card">
                <div class="card-title">📋 Список кассиров</div>
                <div id="cashiersList"><div class="loading-spinner">Загрузка...</div></div>
            </div>

            <!-- Список клиентов -->
            <div class="card">
                <div class="card-title">📋 Список клиентов</div>
                <div id="clientsList"><div class="loading-spinner">Загрузка...</div></div>
            </div>
        </div>
    </div>

    <div id="toast" class="success-toast" style="display:none;"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
