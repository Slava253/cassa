<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#0b1e3a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="img/icon-192.png">
    <title>ГУ СВС | Админ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo-area">
                <h1>👑 ГУ СВС</h1>
                <p>Панель администратора</p>
            </div>
            <div class="user-status" id="userStatus">
                <span>👤 Администратор</span>
                <button onclick="logout()">Выйти</button>
            </div>
        </div>

        <div class="main-content">
            <!-- Добавить кассира -->
            <div class="card">
                <div class="card-title">➕ Добавить кассира</div>
                <div class="grid-2col">
                    <div>
                        <div class="form-group"><label>ФИО кассира</label><input type="text" id="cashierFullName" placeholder="Иванов Иван Иванович"></div>
                        <div class="form-group"><label>Логин</label><input type="text" id="cashierLogin" placeholder="придумайте логин"></div>
                        <div class="form-group"><label>Пароль</label><input type="text" id="cashierPassword" placeholder="придумайте пароль"></div>
                    </div>
                    <div>
                        <div class="form-group"><label>📸 Фото (опционально)</label>
                            <button onclick="document.getElementById('cashierPhoto').click()" class="small-btn">📁 Выбрать фото</button>
                            <input type="file" id="cashierPhoto" accept="image/*" style="display:none;" onchange="onCashierPhoto(event)">
                            <div id="cashierPhotoPreview"></div>
                        </div>
                    </div>
                </div>
                <button onclick="addCashier()" style="width:100%;">✅ Добавить кассира</button>
            </div>

            <!-- Список кассиров -->
            <div class="card">
                <div class="card-title">📋 Кассиры</div>
                <div id="cashiersList"><div class="loading-spinner">Загрузка...</div></div>
            </div>

            <!-- Создать карту клиента -->
            <div class="card">
                <div class="card-title">🎫 Создать карту клиента</div>
                <div class="grid-2col">
                    <div>
                        <div class="form-group"><label>ФИО клиента</label><input type="text" id="clientFullName" placeholder="Петров Петр Петрович"></div>
                        <div class="form-group"><label>📱 Телефон</label><input type="tel" id="clientPhone" placeholder="+7 900 123-45-67"></div>
                    </div>
                </div>
                <button onclick="createClientCard()" class="btn-success" style="width:100%;">🎫 Создать карту</button>
            </div>

            <!-- Список клиентов -->
            <div class="card">
                <div class="card-title">📋 Клиенты</div>
                <div id="clientsList"><div class="loading-spinner">Загрузка...</div></div>
            </div>
        </div>
    </div>

    <div id="toast" class="success-toast" style="display:none;"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
