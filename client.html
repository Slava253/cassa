<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="img/icon-192.png">
    <title>Marka | Моя карта</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo-area">
                <h1>👤 Marka</h1>
                <p>Личный кабинет</p>
            </div>
            <div class="user-status">
                <span id="clientName">👤 Клиент</span>
                <button onclick="logout()">Выйти</button>
            </div>
        </div>

        <div class="main-content">
            <div class="card">
                <div class="card-title">👤 Личный кабинет</div>
                <div id="clientInfo" class="member-info" style="margin-bottom:16px;"></div>
            </div>

            <!-- Корзина -->
            <div class="card">
                <div class="card-title">🛒 Корзина</div>
                <div id="cartList"><div class="empty-state">Корзина пуста</div></div>
                <div style="margin-top:12px;">
                    <button onclick="placeOrder()" class="btn-success" style="width:100%; padding:12px;">📦 Заказать</button>
                </div>
            </div>

            <!-- Список товаров -->
            <div class="card">
                <div class="card-title">📦 Товары</div>
                <div id="productsList"><div class="loading-spinner">Загрузка...</div></div>
            </div>

            <!-- История заказов -->
            <div class="card">
                <div class="card-title">📜 История заказов</div>
                <div id="ordersList"><div class="loading-spinner">Загрузка...</div></div>
            </div>

            <!-- QR-код -->
            <div class="card">
                <div class="card-title">📱 Ваш QR-код</div>
                <div style="text-align:center; padding:20px; background:white; border-radius:20px; border:2px dashed #dae2ec;">
                    <canvas id="qrCanvas" style="max-width:200px; margin:0 auto;"></canvas>
                    <p id="qrDataDisplay" style="font-size:0.8rem; color:#7a8a9e; margin-top:8px;"></p>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="success-toast" style="display:none;"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/barcode.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/client.js"></script>
</body>
</html>
