<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#0b1e3a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="img/icon-192.png">
    <title>ГУ СВС | Моя карта</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo-area">
                <h1>👤 ГУ СВС</h1>
                <p>Личный кабинет</p>
            </div>
            <div class="user-status" id="userStatus">
                <span id="clientName">👤 Клиент</span>
                <button onclick="logout()">Выйти</button>
            </div>
        </div>

        <div class="main-content">
            <div class="card">
                <div class="card-title">👤 Личный кабинет</div>
                <div id="clientInfo" class="member-info" style="margin-bottom:16px;"></div>
            </div>

            <div class="card">
                <div class="card-title">📱 Ваш QR-код (электронная карта)</div>
                <div class="qr-container" id="qrContainer" style="text-align:center; padding:20px;">
                    <canvas id="qrCanvas" style="max-width:200px; margin:0 auto;"></canvas>
                    <p style="font-size:0.8rem; color:#7a8a9e; margin-top:8px;">Покажите QR-код кассиру</p>
                    <p id="cardNumberDisplay" style="font-size:0.7rem; color:#3e5f7e;"></p>
                </div>
            </div>

            <div class="card">
                <div class="card-title">⭐ Бонусный баланс</div>
                <div style="text-align:center; padding:20px;">
                    <div style="font-size:3rem; font-weight:bold; color:#1a3359;" id="clientBalance">0</div>
                    <div style="color:#7a8a9e;">баллов</div>
                    <div style="font-size:0.8rem; color:#3e5f7e; margin-top:8px;">За каждые 100₽ в чеке вы получаете 5 баллов</div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">📜 История покупок</div>
                <div id="clientHistory"><div class="loading-spinner">Загрузка...</div></div>
            </div>
        </div>
    </div>

    <div id="toast" class="success-toast" style="display:none;"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/2.2.2/qrious.min.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/client.js"></script>
</body>
</html>
